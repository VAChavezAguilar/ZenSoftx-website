<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear Cuenta | ZenSoftx</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="auth-page" role="main" style="padding:var(--space-12) var(--space-4);">
    <div class="auth-card" style="max-width:560px;">

      <!-- Logo -->
      <div class="auth-logo">
        <img src="logo.png" alt="ZenSoftx Logo" class="auth-brand-logo" />
        <h1>Crear Cuenta ZenSoftx</h1>
        <p>Regístrate gratis y comienza a conectar tus automatizaciones en minutos</p>
      </div>

      <!-- Formulario -->
      <form action="dashboard-usuario.html" method="get" novalidate>

        <div class="form-row cols-2">
          <div class="form-group">
            <label for="nombre" class="form-label">Nombre <span class="required">*</span></label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              class="form-control"
              placeholder="Ej. Carlos"
              required
            />
          </div>
          <div class="form-group">
            <label for="apellidos" class="form-label">Apellidos <span class="required">*</span></label>
            <input
              type="text"
              id="apellidos"
              name="apellidos"
              class="form-control"
              placeholder="Ej. García López"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Correo profesional / corporativo <span class="required">*</span></label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              placeholder="tu@empresa.com"
              required
            />
          </div>
          <p class="form-hint">Recibirás un código de verificación e instrucciones de API.</p>
        </div>

        <div class="form-group">
          <label for="plan" class="form-label">Plan de interés</label>
          <select id="plan" name="plan" class="form-control">
            <option value="starter">Plan Starter (Gratuito - 1,000 req/mes)</option>
            <option value="pro" selected>Plan Pro (50,000 req/mes + Soporte Webhook)</option>
            <option value="enterprise">Plan Enterprise (Infraestructura Dedicada)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña <span class="required">*</span></label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="Mínimo 8 caracteres"
              required
              minlength="8"
            />
            <span class="input-suffix" id="toggle-pass" role="button" aria-label="Mostrar/ocultar contraseña">👁️</span>
          </div>
        </div>

        <div class="form-group" style="margin-bottom:var(--space-6);">
          <div class="checkbox-group">
            <input type="checkbox" id="terms" name="terms" required checked />
            <label for="terms">Acepto los <a href="#" style="color:var(--white);text-decoration:underline;">Términos de Servicio</a> y la <a href="#" style="color:var(--white);text-decoration:underline;">Política de Privacidad</a> de ZenSoftx.</label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-full btn-lg">
          Crear mi cuenta gratis →
        </button>
      </form>

      <p class="auth-footer-text">
        ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
      </p>

    </div>
  </main>

  <script>
    const toggle = document.getElementById('toggle-pass');
    const passInput = document.getElementById('password');
    toggle.addEventListener('click', () => {
      const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passInput.setAttribute('type', type);
    });
  </script>

</body>
</html>
