<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión | ZenSoftx</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="auth-page" role="main">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <img src="logo.png" alt="ZenSoftx Logo" class="auth-brand-logo" />
        <h1>Bienvenido a ZenSoftx</h1>
        <p>Ingresa a tu cuenta para gestionar tus automatizaciones e integraciones</p>
      </div>

      <!-- Alerta demo -->
      <div class="alert alert-primary" role="alert" style="margin-bottom:var(--space-5);">
        <span class="alert-icon">⚡</span>
        <div class="alert-content">
          <div class="alert-title">Cuenta demo disponible</div>
          <div>usuario@zensoftx.io / <strong>demo123</strong></div>
        </div>
      </div>

      <!-- Formulario -->
      <form action="dashboard-usuario.html" method="get" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Correo electrónico <span class="required">*</span></label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              placeholder="tu@empresa.com"
              value="usuario@zensoftx.io"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña <span class="required">*</span></label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="Ingresa tu contraseña"
              value="demo123"
              required
            />
            <span class="input-suffix" id="toggle-pass" role="button" aria-label="Mostrar/ocultar contraseña">👁️</span>
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-6);">
          <div class="checkbox-group">
            <input type="checkbox" id="remember" name="remember" checked />
            <label for="remember">Recordarme</label>
          </div>
          <a href="#" style="font-size:var(--text-sm);color:var(--white);font-weight:600;">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn btn-primary w-full btn-lg">
          Ingresar al Panel →
        </button>
      </form>

      <div class="auth-divider">o continúa con SSO</div>

      <div style="display:flex;gap:var(--space-3);">
        <button type="button" class="btn btn-ghost w-full">
          🔑 Google OAuth
        </button>
        <button type="button" class="btn btn-ghost w-full">
          🐙 GitHub SSO
        </button>
      </div>

      <p class="auth-footer-text">
        ¿No tienes cuenta? <a href="registro.html">Regístrate gratis</a>
      </p>

    </div>
  </main>

  <script>
    const toggle = document.getElementById('toggle-pass');
    const passInput = document.getElementById('password');
    toggle.addEventListener('click', () => {
      const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passInput.setAttribute('type', type);
    });
  </script>

</body>
</html>
